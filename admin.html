<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель — СГУ</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
html,body{margin:0;background:#101216;color:#f4f5f7}
body{display:flex;flex-direction:column;align-items:center;padding:20px;min-height:100dvh}
.card{width:min(560px,100%);background:#171b22;border:1px solid #39414d;border-radius:14px;padding:22px;margin-bottom:16px}
h1{font-size:19px;margin:0 0 14px}
h2{font-size:15px;margin:18px 0 10px}
input{width:100%;padding:12px;border-radius:9px;border:1px solid #39414d;background:#0f1114;color:#fff;font-size:15px;margin-bottom:8px}
button{padding:11px 14px;border-radius:9px;border:none;background:#d5b957;color:#15161a;font-weight:800;cursor:pointer;font-size:13px}
button.sec{background:#23272f;color:#e8eaee}
button.danger{background:#3b181c;color:#fca5a5}
button[disabled]{opacity:.5;cursor:wait}
.row{display:flex;flex-direction:column;gap:7px;background:#121418;border:1px solid #282c34;border-radius:9px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.row .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row .r2{display:flex;gap:6px}
.row input{margin:0;padding:8px 10px;font-size:12px}
.mono{font-family:Consolas,monospace;color:#d5b957;font-size:11.5px;word-break:break-all}
.bound{color:#4ade80;font-size:11px}
.unbound{color:#fbbf24;font-size:11px}
#save{position:fixed;right:14px;bottom:14px;font-size:12px;font-weight:700;padding:8px 14px;border-radius:8px;background:#23272f;color:#aeb5c0}
#save.ok{color:#4ade80}#save.err{color:#ff6b6b}#save.busy{color:#fbbf24}
.out{width:100%;min-height:110px;background:#0f1114;color:#9fe8a0;border:1px solid #282c34;border-radius:9px;padding:10px;font-family:Consolas,monospace;font-size:11.5px}
.hint{font-size:11.5px;color:#8b93a0;line-height:1.5}
.hidden{display:none}
</style>
</head>
<body>
<div class="card" id="auth">
  <h1>🔐 Админ-панель СГУ</h1>
  <input id="pin" placeholder="Master-ключ" autocomplete="off">
  <button class="sec" id="tokBtn">🔑 ТОКЕН ДЛЯ АВТОСОХРАНЕНИЯ</button>
  <button id="go">ВОЙТИ</button>
  <input id="tok" class="hidden" placeholder="ghp_... (токен GitHub, сохранится только в вашем браузере)">
  <div class="hint" id="err" style="color:#ff6b6b;margin-top:8px"></div>
</div>

<div id="panel" class="hidden">
  <div class="card">
    <h1>Выдать ключ</h1>
    <input id="who" placeholder="Имя человека">
    <input id="customKey" placeholder="Ключ: оставьте пустым для автогенерации или впишите свой">
    <button id="gen">＋ ВЫДАТЬ КЛЮЧ</button>
    <div class="hint" id="newkey" style="margin-top:10px"></div>
  </div>
  <div class="card">
    <h1>Ключи и устройства</h1>
    <div id="list"></div>
  </div>
  <div class="card">
    <h1>Ручная выгрузка (если автосохранение сломалось)</h1>
    <textarea class="out" id="out" readonly></textarea>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="sec" id="copy">КОПИРОВАТЬ</button>
      <button class="sec" id="download">СКАЧАТЬ keys.json</button>
    </div>
  </div>
</div>
<div id="save"></div>

<script>
  const REPO = 'georgijkaribov5-arch/sgu-panels';
  const GH_TOKEN = ''; // токен для автосохранения keys.json
  async function sha256hex(s) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  function rnd() {
    const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    return Array.from(crypto.getRandomValues(new Uint8Array(8))).map(v => abc[v % abc.length]).join('');
  }
</script>
<script>
(() => {
  let DATA = { keys: [] };
  const $ = id => document.getElementById(id);
  const saveEl = $('save');

  function setStatus(text, cls) {
    saveEl.innerText = text;
    saveEl.className = cls || '';
  }

  async function saveToGitHub() {
    setStatus('СОХРАНЕНИЕ…', 'busy');
    const json = JSON.stringify(DATA, null, 2);
    try {
      const tok = localStorage.getItem('SGU_GH_TOKEN');
      if (!tok) { setStatus('НЕТ ТОКЕНА — нажмите «🔑 ТОКЕН» и вставьте ghp_…', 'err'); return; }
      const h = { Authorization: 'Bearer ' + tok, 'User-Agent': 'sgu-admin', Accept: 'application/vnd.github+json' };
      let sha;
      try { sha = (await (await fetch(`https://api.github.com/repos/${REPO}/contents/keys.json`, { headers: h })).json()).sha; } catch (e) {}
      const res = await fetch(`https://api.github.com/repos/${REPO}/contents/keys.json`, {
        method: 'PUT', headers: { ...h, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: 'update keys.json (admin panel)', content: btoa(unescape(encodeURIComponent(json))), branch: 'main', sha })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      setStatus('СОХРАНЕНО ✓ (обновится на сайте ~через минуту)', 'ok');
      setTimeout(() => setStatus(''), 4000);
    } catch (e) {
      setStatus('НЕ СОХРАНОСЬ: ' + e.message + ' — скачайте keys.json и пришлите мне', 'err');
    }
  }

  async function loadKeys() {
    DATA = await (await fetch('keys.json?r=' + Date.now())).json();
    render();
  }
  function updateOut() { $('out').value = JSON.stringify(DATA, null, 2); }

  function render() {
    const list = $('list');
    list.innerHTML = '';
    DATA.keys.filter(k => !k.admin).forEach(k => {
      const div = document.createElement('div');
      div.className = 'row';
      const r1 = document.createElement('div');
      r1.className = 'r1';
      const devState = k.deviceHash
        ? `<span class="bound">● закреплён за устройством (${k.deviceHash.slice(0, 8)}…)</span>`
        : '<span class="unbound">○ устройство не закреплено</span>';
      r1.innerHTML = `<span><b>${k.name}</b> ${devState}<br><span class="mono">${k.hash.slice(0, 12)}…</span></span>`;
      const del = document.createElement('button');
      del.className = 'danger'; del.textContent = 'УДАЛИТЬ';
      del.onclick = async () => { DATA.keys = DATA.keys.filter(x => x !== k); render(); await saveToGitHub(); };
      r1.appendChild(del);

      const r2 = document.createElement('div');
      r2.className = 'r2';
      const inp = document.createElement('input');
      inp.placeholder = 'Код устройства из заявки (длинный код)';
      const bind = document.createElement('button');
      bind.textContent = k.deviceHash ? 'СМЕНИТЬ УСТРОЙСТВО' : 'ЗАКРЕПИТЬ';
      bind.onclick = async () => {
        const code = inp.value.trim();
        if (!code) return;
        k.deviceHash = await sha256hex(code + '|' + k.hash);
        inp.value = '';
        render();
        await saveToGitHub();
      };
      const unbind = document.createElement('button');
      unbind.className = 'sec'; unbind.textContent = 'ОТВЯЗАТЬ';
      unbind.onclick = async () => { delete k.deviceHash; render(); await saveToGitHub(); };
      r2.appendChild(inp); r2.appendChild(bind); r2.appendChild(unbind);

      div.appendChild(r1); div.appendChild(r2);
      list.appendChild(div);
    });
    updateOut();
  }

  $('tokBtn').addEventListener('click', () => { $('tok').classList.toggle('hidden'); });
  $('tok').addEventListener('input', () => {
    if ($('tok').value.trim().startsWith('ghp_')) {
      localStorage.setItem('SGU_GH_TOKEN', $('tok').value.trim());
      $('tok').value = '';
      $('tok').classList.add('hidden');
      $('tokBtn').innerText = '🔑 ТОКЕН СОХРАНЁН ✓';
    }
  });

  $('go').addEventListener('click', async () => {
    try {
      await loadKeys();
      const h = await sha256hex($('pin').value.trim());
      if ((DATA.keys || []).some(x => x.admin && x.hash === h)) {
        $('auth').classList.add('hidden');
        $('panel').classList.remove('hidden');
      } else {
        $('err').innerText = 'Неверный master-ключ.';
      }
    } catch (e) { $('err').innerText = 'Нет keys.json'; }
  });

  $('gen').addEventListener('click', async () => {
    const name = $('who').value.trim() || 'без имени';
    const key = $('customKey').value.trim() || ('SGU-' + rnd().slice(0, 4) + '-' + rnd().slice(4));
    DATA.keys.push({ name, hash: await sha256hex(key) });
    $('newkey').innerHTML = `Ключ для <b>${name}</b>: <span class="mono">${key}</span><br>Передайте его — после сохранения он заработает.`;
    $('who').value = ''; $('customKey').value = '';
    render();
    await saveToGitHub();
  });

  $('copy').addEventListener('click', () => navigator.clipboard.writeText($('out').value));
  $('download').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([$('out').value], { type: 'application/json' }));
    a.download = 'keys.json';
    a.click();
  });
})();
</script>
</body>
</html>
