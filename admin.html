<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель — СГУ</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
html,body{margin:0;background:#101216;color:#f4f5f7}
body{display:flex;flex-direction:column;align-items:center;padding:20px;min-height:100dvh}
.card{width:min(520px,100%);background:#171b22;border:1px solid #39414d;border-radius:14px;padding:22px;margin-bottom:16px}
h1{font-size:19px;margin:0 0 14px}
input{width:100%;padding:12px;border-radius:9px;border:1px solid #39414d;background:#0f1114;color:#fff;font-size:15px;margin-bottom:8px}
button{padding:11px 14px;border-radius:9px;border:none;background:#d5b957;color:#15161a;font-weight:800;cursor:pointer;font-size:13px}
button.sec{background:#23272f;color:#e8eaee}
button.danger{background:#3b181c;color:#fca5a5}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;background:#121418;border:1px solid #282c34;border-radius:9px;padding:9px 12px;margin-bottom:7px;font-size:13px}
.mono{font-family:Consolas,monospace;color:#d5b957}
.out{width:100%;min-height:130px;background:#0f1114;color:#9fe8a0;border:1px solid #282c34;border-radius:9px;padding:10px;font-family:Consolas,monospace;font-size:11.5px}
.hint{font-size:11.5px;color:#8b93a0;line-height:1.5}
.hidden{display:none}
</style>
</head>
<body>
<div class="card" id="auth">
  <h1>🔐 Админ-панель СГУ</h1>
  <input id="pin" placeholder="Master-ключ (SGU-…)" autocomplete="off">
  <button id="go">ВОЙТИ</button>
  <div class="hint" id="err" style="color:#ff6b6b;margin-top:8px"></div>
</div>

<div id="panel" class="hidden">
  <div class="card">
    <h1>Выдать новый ключ</h1>
    <input id="who" placeholder="Имя человека (кто получит ключ)">
    <button id="gen">＋ СГЕНЕРИРОВАТЬ КЛЮЧ</button>
    <div class="hint" id="newkey" style="margin-top:10px"></div>
  </div>
  <div class="card">
    <h1>Активные ключи</h1>
    <div id="list"></div>
    <button class="sec" id="refresh">↺ ОБНОВИТЬ</button>
  </div>
  <div class="card">
    <h1>Обновить keys.json на сайте</h1>
    <p class="hint">Нажмите «Скопировать», затем пришлите скопированное боту-помощнику (или загрузите файл keys.json в репозиторий через GitHub: Add file → Upload files → keys.json).</p>
    <textarea class="out" id="out" readonly></textarea>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button id="copy">СКОПИРОВАТЬ keys.json</button>
      <button class="sec" id="download">СКАЧАТЬ ФАЙЛ</button>
    </div>
  </div>
</div>

<script>
(() => {
  let _enc = new TextEncoder();
  async function sha256hex(s) {
    const buf = await crypto.subtle.digest('SHA-256', _enc.encode(s));
    return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  let DATA = { keys: [] };
  const $ = id => document.getElementById(id);

  async function loadKeys() {
    DATA = await (await fetch('keys.json?r=' + Date.now())).json();
  }
  function render() {
    const list = $('list');
    list.innerHTML = '';
    DATA.keys.forEach(k => {
      const div = document.createElement('div');
      div.className = 'row';
      div.innerHTML = `<span>${k.name}${k.admin ? ' <span class="hint">(админ)</span>' : ''}</span><span class="mono">${k.hash.slice(0,10)}…</span>`;
      if (!k.admin) {
        const btn = document.createElement('button');
        btn.className = 'danger';
        btn.textContent = 'УДАЛИТЬ';
        btn.onclick = () => { DATA.keys = DATA.keys.filter(x => x !== k); render(); updateOut(); };
        div.appendChild(btn);
      }
      list.appendChild(div);
    });
    updateOut();
  }
  function updateOut() {
    $('out').value = JSON.stringify(DATA, null, 2);
  }
  function rnd() {
    const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    return Array.from(crypto.getRandomValues(new Uint8Array(8))).map(v => abc[v % abc.length]).join('');
  }

  $('go').addEventListener('click', async () => {
    try {
      await loadKeys();
      const h = await sha256hex($('pin').value.trim().toUpperCase());
      if ((DATA.keys || []).some(x => x.admin && x.hash === h)) {
        $('auth').classList.add('hidden');
        $('panel').classList.remove('hidden');
        render();
      } else {
        $('err').innerText = 'Неверный master-ключ.';
      }
    } catch (e) { $('err').innerText = 'Нет keys.json'; }
  });

  $('gen').addEventListener('click', async () => {
    const name = $('who').value.trim() || 'без имени';
    const key = 'SGU-' + rnd().slice(0,4) + '-' + rnd().slice(4);
    DATA.keys.push({ name, hash: await sha256hex(key) });
    $('newkey').innerHTML = `Ключ для <b>${name}</b>: <span class="mono">${key}</span><br>Передайте его лично — он появится в списке ниже.`;
    $('who').value = '';
    render();
  });

  $('refresh').addEventListener('click', async () => { await loadKeys(); render(); });
  $('copy').addEventListener('click', () => { navigator.clipboard.writeText($('out').value); $('copy').innerText = 'СКОПИРОВАНО ✓'; setTimeout(()=>$('copy').innerText='СКОПИРОВАТЬ keys.json',1500); });
  $('download').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([$('out').value], { type: 'application/json' }));
    a.download = 'keys.json';
    a.click();
  });
})();
</script>
</body>
</html>
