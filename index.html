<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101216">
<title>Выбор СГУ</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#101216;color:#f4f5f7}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:22px}
#menu{width:min(680px,100%);text-align:center}
h1{font-size:clamp(25px,5vw,38px);margin:0 0 10px}
.sub{color:#aeb5c0;margin:0 0 28px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.choice{min-height:150px;border:1px solid #39414d;border-radius:16px;background:linear-gradient(145deg,#252b34,#171b22);color:white;padding:22px 14px;cursor:pointer;box-shadow:0 12px 30px #0008;transition:.15s}
.choice:hover{transform:translateY(-3px);border-color:#d5b957}
.choice strong{display:block;font-size:clamp(17px,3vw,23px);margin-bottom:9px}
.choice span{font-size:13px;color:#b8c0ca}
    .choice .credit{display:block;margin-top:6px;font-size:11px;color:#d5b957}
    .choice .credit{display:block;margin-top:6px;font-size:11px;color:#d5b957;text-transform:none}
#app{display:none;position:fixed;inset:0;background:#0f1114}
#app iframe{border:0;width:100%;height:100%;display:block}
#back{position:fixed;z-index:10;top:12px;left:12px;border:1px solid #555d69;border-radius:9px;background:#171b22eF;color:#fff;padding:10px 14px;font-weight:700;cursor:pointer}
@media(max-width:520px){.choices{grid-template-columns:1fr}.choice{min-height:115px}}
</style>
<script>
(() => {
  function utf8(s){const o=[];for(const ch of s){const c=ch.codePointAt(0);if(c<0x80)o.push(c);else if(c<0x800)o.push(0xC0|(c>>6),0x80|(c&63));else o.push(0xE0|(c>>12),0x80|((c>>6)&63),0x80|(c&63));}return new Uint8Array(o);}
  function rr(x,n){return (x>>>n)|(x<<(32-n));}
  function sha256(bytes){
    const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
    let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    const len=bytes.length,bitLen=len*8;
    const p=[...bytes,0x80];
    while(p.length%64!==56)p.push(0);
    for(let i=7;i>=0;i--)p.push(Math.floor(bitLen/Math.pow(2,i*8))&255);
    for(let off=0;off<p.length;off+=64){
      const w=[];
      for(let i=0;i<16;i++)w[i]=(p[off+i*4]<<24)|(p[off+i*4+1]<<16)|(p[off+i*4+2]<<8)|p[off+i*4+3];
      for(let i=16;i<64;i++){
        const s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3);
        const s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10);
        w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
      }
      let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
      for(let i=0;i<64;i++){
        const S1=rr(e,6)^rr(e,11)^rr(e,25);
        const ch=(e&f)^(~e&g);
        const t1=(h+S1+ch+K[i]+w[i])|0;
        const S0=rr(a,2)^rr(a,13)^rr(a,22);
        const mj=(a&b)^(a&c)^(b&c);
        const t2=(S0+mj)|0;
        h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
      }
      H=[(H[0]+a)|0,(H[1]+b)|0,(H[2]+c)|0,(H[3]+d)|0,(H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0];
    }
    return new Uint8Array(H.map(x=>[(x>>>24)&255,(x>>>16)&255,(x>>>8)&255,x&255]).flat());
  }
  (async () => {
    const saved = localStorage.getItem('SGU_ACCESS');
    let ok = false;
    try {
      const data = await (await fetch('keys.json?r=' + Date.now())).json();
      ok = saved && (data.keys || []).some(x => x.hash === saved);
    } catch (e) { ok = !!saved; }
    if (!ok) location.href = 'login.html';
  })();
})();
</script>
</head>
<body>
<main id="menu">
  <h1>Выбор СГУ</h1>
  <p class="sub">Выберите пульт для запуска</p>
  <div class="choices">
    <button class="choice" onclick="openPanel('gibdd/index.html')">
      <strong>ГИБДД по ЧР</strong><span>Пульт СГУ ГИБДД</span><span class="credit">shama&amp;by grek</span>
    </button>
    <button class="choice" onclick="openPanel('hazard/index.html')">
      <strong>Premier Hazard 7007</strong><span>Пульт Hazard 7007</span><span class="credit">shama&amp;by grek</span>
    </button>
    <button class="choice" onclick="openPanel('k13/index.html')">
      <strong>СГУ К-13</strong><span>Пульт К-13</span><span class="credit">shama&amp;by grek</span>
    </button>
  </div>
</main>
<section id="app">
  <button id="back" onclick="backToMenu()">← Выбор СГУ</button>
  <iframe id="panel" title="Пульт СГУ"></iframe>
</section>
<script>
function openPanel(src){
  document.getElementById('panel').src=src;
  document.getElementById('menu').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('back').style.display='block';
}
function backToMenu(){
  document.getElementById('panel').src='about:blank';
  document.getElementById('app').style.display='none';
  document.getElementById('menu').style.display='block';
}
</script>
</body>
</html>
