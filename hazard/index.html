<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Premier Hazard 7007</title>
<style>
/* Пульт 1 в 1 по скрину: вертикальный телефонный вид, панель сверху, две большие кнопки внизу */
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;font-family:'Segoe UI',Arial,sans-serif}
html,body{margin:0;background:#0a0a0c;color:#e8e8ea}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:10px 12px 18px}

/* ---- Панель ---- */
.stage{width:100%;max-width:400px;background:linear-gradient(180deg,#05050699,#0a0a0c00)}
.panel{
  position:relative;width:100%;aspect-ratio:340/430;
  background:linear-gradient(165deg,#1c1e22 0%,#101216 55%,#0a0b0e 100%);
  border-radius:14px;
  box-shadow:0 22px 40px rgba(0,0,0,.85), inset 0 1px 1px rgba(255,255,255,.1), inset 0 -6px 12px rgba(0,0,0,.9);
}
.frame{position:absolute;inset:6px;border:1.5px solid #3a3d44;border-radius:10px;pointer-events:none}

/* RJ45 слева сверху */
.rj{position:absolute;top:22px;left:22px;width:62px;height:74px;background:#060708;border-radius:6px;border:1.5px solid #2c2f36;box-shadow:inset 0 4px 8px #000;display:flex;align-items:center;justify-content:center}
.rj-inner{width:46px;height:34px;background:#0e0f11;border-radius:4px;position:relative}
.rj-pins{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:30px;height:12px;background:repeating-linear-gradient(90deg,#b9a04a 0 3px,transparent 3px 6.4px)}

/* Подпись OFF/VOL */
.t-vol{position:absolute;top:26px;right:120px;color:#d8dade;font-size:12px;font-weight:700;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.5px}
.t-vol i{position:absolute;top:2px;left:-9px;width:5px;height:5px;border-radius:50%;background:#cfd2d6}

/* Ручка */
.knob{
  position:absolute;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 38% 32%, #202227 0%, #121317 55%, #060708 100%);
  box-shadow:0 8px 16px rgba(0,0,0,.9), inset 0 1.5px 2px rgba(255,255,255,.14), inset 0 -6px 12px rgba(0,0,0,.85), 0 0 0 2px #232529;
}
.knob .slot{position:absolute;left:50%;top:9%;transform:translateX(-50%);width:9px;height:46%;border-radius:5px;background:linear-gradient(90deg,#000,#2e3138 55%,#0a0b0d)}
.knob .dot{position:absolute;right:14%;top:46%;width:7px;height:7px;border-radius:50%;background:#f4f6f8;box-shadow:0 0 4px #000}
.k-vol{top:26px;right:26px;width:74px;height:74px;transform:rotate(115deg)}
.k-mode{top:52%;right:24px;width:96px;height:96px;transform:rotate(14deg)}
.k-gear{position:absolute;inset:0;border-radius:50%;transition:transform .15s ease-out;will-change:transform}

/* Надписи/бейдж на левой половине */
.t-7007{position:absolute;top:118px;left:44px;color:#d8dade;font-size:15px;font-weight:800;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:1px}
.badge{position:absolute;top:148px;left:76px;border:1.5px solid #3a3d44;border-radius:5px;padding:5px 6px;color:#d8dade;font-size:8.5px;font-weight:800;line-height:1.25;text-align:center;display:flex;flex-direction:column}
.badge span{letter-spacing:.6px}

/* Левый столбик: белые кнопки MAN/HORN + подписи */
.wbtn{position:absolute;left:26px;width:44px;height:44px;border-radius:9px;border:none;cursor:pointer;background:linear-gradient(180deg,#f2f2ef,#cfcec8);box-shadow:0 3px 6px #000, inset 0 1.5px 2px #fff, inset 0 -2px 4px rgba(0,0,0,.3);transition:transform .05s}
.wbtn:active{transform:translateY(2px)}
.wbtn:disabled{opacity:.28;pointer-events:none}
#btnAst{top:262px}
#btnBild{top:346px}
.t-lbl{position:absolute;color:#d8dade;font-size:12px;font-weight:800;writing-mode:vertical-rl;transform:rotate(180deg)}
.t-pa{top:246px;left:84px}
.t-man{top:270px;left:96px}
.t-horn{top:338px;left:84px}
.t-radio{top:288px;left:110px}

/* Правый столбик надписей режимов с точками */
.m-marks{position:absolute;right:132px;top:150px;display:flex;flex-direction:column;gap:18px;align-items:flex-end}
.m-mark{display:flex;align-items:center;gap:6px;color:#d8dade;font-size:11.5px;font-weight:800;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.8px}
.m-mark i{width:5.5px;height:5.5px;border-radius:50%;background:#cfd2d6}
.m-marks .m-mark:nth-child(1){transform:none;writing-mode:horizontal-tb}

.m-pa{position:absolute;right:134px;top:322px;display:flex;flex-direction:column;align-items:flex-end;gap:16px}
.m-pa .m-mark{writing-mode:vertical-rl;transform:rotate(180deg)}

/* Ножки панели */
.feet{display:flex;justify-content:center;gap:70px;margin-top:2px}
.foot{width:64px;height:44px;background:#0d0e11;border-radius:0 0 8px 8px;box-shadow:0 8px 12px rgba(0,0,0,.7), inset 0 2px 3px rgba(255,255,255,.05)}

/* ---- Большие кнопки ---- */
.big-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:400px;margin-top:18px}
.big{
  padding:20px 10px;border:none;border-radius:12px;cursor:pointer;
  background:#232529;color:#fff;font-size:19px;font-weight:800;letter-spacing:1.5px;
  box-shadow:0 10px 22px rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.08);
  transition:transform .05s, box-shadow .05s, background .1s;
}
.big:active,.big.pressed{transform:translateY(3px);box-shadow:0 3px 8px rgba(0,0,0,.5);background:#2e3138}
.stat{text-align:center;font-size:10px;font-weight:700;color:#555;margin-top:12px;letter-spacing:.4px;height:14px}
</style>
</head>
<body>

<div class="stage">
  <div class="panel">
    <div class="frame"></div>

    <div class="rj"><div class="rj-inner"><div class="rj-pins"></div></div></div>

    <div class="t-vol"><i></i>OFF/VOL</div>
    <div class="knob k-vol" id="vol"><div class="slot"></div><div class="dot"></div></div>

    <div class="t-7007">7007</div>
    <div class="badge"><span>PREMIER</span><span>HAZARD</span></div>

    <div class="t-lbl t-pa">PA</div>
    <div class="t-lbl t-man">MAN</div>
    <div class="t-lbl t-radio">RADIO</div>
    <div class="t-lbl t-horn">HORN</div>

    <button class="wbtn" id="btnAst" title="MAN"></button>
    <button class="wbtn" id="btnBild" title="HORN"></button>

    <div class="m-marks">
      <div class="m-mark">HI<i></i></div>
      <div class="m-mark"><i></i>YELP</div>
      <div class="m-mark"><i></i>WAIL</div>
      <div class="m-mark"><i></i>STANDBY</div>
    </div>
    <div class="m-pa">
      <div class="m-mark">PA<i></i></div>
      <div class="m-mark">RADIO<i></i></div>
    </div>

    <div class="knob k-mode" id="mode"><div class="slot"></div><div class="dot"></div></div>
  </div>
  <div class="feet"><div class="foot"></div><div class="foot"></div></div>
</div>

<div class="big-row">
  <button class="big" id="btnMan">MAN</button>
  <button class="big" id="btnHorn">HORN</button>
</div>
<div class="stat" id="disp-status"></div>

<audio id="snd-short" src="short.mp3" preload="auto"></audio>
<audio id="snd-horn"  src="horn.wav"  preload="auto"></audio>
<audio id="snd-wail"  src="wail.wav"  preload="auto"></audio>
<audio id="snd-yelp"  src="yelp.mp3"  preload="auto"></audio>
<audio id="snd-hilo"  src="hilo.wav"  preload="auto"></audio>
<script>

(() => {
  const $ = (id) => document.getElementById(id);
  const angles = [115, 90, 65, 40, 14, -14];
  const modeLeds = ['led-hilo', 'led-yelp', 'led-wail', 'led-stby', 'led-pa', 'led-rad'];
  let modeIndex = 4; // PA ��� �������
  let powerOn = false;
  const sounds = {
    short: $('snd-short'),
    horn: $('snd-horn'),
    wail: $('snd-wail'),
    yelp: $('snd-yelp'),
    hilo: $('snd-hilo')
  };
  // ������ (wail/yelp/hilo) ������ ��������, ���� ������� �����
  let sirenAudio = null;

  function stopSiren() {
    if (sirenAudio) {
      sirenAudio.pause();
      sirenAudio.currentTime = 0;
      sirenAudio = null;
    }
  }

  function startSiren() {
    stopSiren();
    const s = sounds[['hilo', 'yelp', 'wail'][modeIndex]];
    if (!s) return;
    s.loop = true;
    s.volume = 1;
    s.currentTime = 0;
    sirenAudio = s;
    s.play().catch(err => console.warn('�� ������� ������� ������:', err));
  }

  function playHold(name) {
    const s = sounds[name];
    if (!s) return;
    s.loop = true;
    s.volume = 1;
    s.currentTime = 0;
    s.play().catch(err => console.warn('�� ������� ������� ' + name + ':', err));
  }

  function stopHold(name) {
    const s = sounds[name];
    if (!s) return;
    s.pause();
    s.currentTime = 0;
  }
  let audioContext = null;
  let trillTimer = null;
  let trillOsc = null;
  let trillGain = null;

  function vibrate(ms = 20) {
    if (navigator.vibrate) navigator.vibrate(ms);
  }

  function stopTrill() {
    if (trillTimer) {
      clearInterval(trillTimer);
      trillTimer = null;
    }
    if (trillGain && audioContext) {
      try { trillGain.gain.setTargetAtTime(0, audioContext.currentTime, 0.015); } catch (e) {}
    }
    if (trillOsc) {
      try { trillOsc.stop(); } catch (e) {}
      trillOsc = null;
    }
    trillGain = null;
  }

  async function startTrill() {
    stopTrill();
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      audioContext = audioContext || new AudioCtx();
      if (audioContext.state === 'suspended') await audioContext.resume();

      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const filter = audioContext.createBiquadFilter();
      osc.type = 'square';
      osc.frequency.value = 760;
      filter.type = 'lowpass';
      filter.frequency.value = 1800;
      gain.gain.value = 0;
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioContext.destination);
      osc.start();
      trillOsc = osc;
      trillGain = gain;

      let phase = false;
      const pulse = () => {
        if (!trillGain || !audioContext) return;
        phase = !phase;
        const now = audioContext.currentTime;
        trillGain.gain.cancelScheduledValues(now);
        trillGain.gain.setTargetAtTime(phase ? 0.13 : 0.008, now, 0.008);
        if (trillOsc) trillOsc.frequency.setTargetAtTime(phase ? 920 : 680, now, 0.012);
      };
      pulse();
      trillTimer = setInterval(pulse, 115);
    } catch (err) {
      console.warn('�� ������� ��������� ���� PA:', err);
    }
  }

  // ===== PA: ����� �������� � �������� ������ =====
  let micStream = null;
  let micNodes = [];

  function makeHornDistortion(amount) {
    const n = 44100;
    const curve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i * 2) / n - 1;
      curve[i] = ((3 + amount) * x * 20 * (Math.PI / 180)) / (Math.PI + amount * Math.abs(x));
    }
    return curve;
  }

  async function startPA() {
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no mic');
      audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') await audioContext.resume();

      micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false } });
      const source = audioContext.createMediaStreamSource(micStream);

      const hp = audioContext.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 460; hp.Q.value = 0.8;
      const peak = audioContext.createBiquadFilter();
      peak.type = 'peaking'; peak.frequency.value = 1350; peak.Q.value = 1.6; peak.gain.value = 11;
      const lp = audioContext.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 2900; lp.Q.value = 0.9;
      const shaper = audioContext.createWaveShaper();
      shaper.curve = makeHornDistortion(18);
      shaper.oversample = '2x';
      const g = audioContext.createGain();
      g.gain.value = 2.2;
      const delay = audioContext.createDelay();
      delay.delayTime.value = 0.13;
      const echo = audioContext.createGain();
      echo.gain.value = 0.24;

      source.connect(hp); hp.connect(peak); peak.connect(lp); lp.connect(shaper); shaper.connect(g);
      g.connect(audioContext.destination);
      g.connect(delay); delay.connect(echo); echo.connect(audioContext.destination);
      micNodes = [source, hp, peak, lp, shaper, g, delay, echo];
    } catch (err) {
      // ��������� ��� � ��������� ��������������� ����� ��� �������� �������
      startTrill();
    }
  }

  function stopPA() {
    micNodes.forEach(node => { try { node.disconnect(); } catch (e) {} });
    micNodes = [];
    if (micStream) {
      micStream.getTracks().forEach(t => t.stop());
      micStream = null;
    }
  }

  // ===== RADIO: ��� ����� =====
  let radioNodes = [];

  function startRadio() {
    stopRadio();
    try {
      audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();

      // ����� ���
      const len = audioContext.sampleRate * 2;
      const buf = audioContext.createBuffer(1, len, audioContext.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = audioContext.createBufferSource();
      src.buffer = buf;
      src.loop = true;

      const band = audioContext.createBiquadFilter();
      band.type = 'bandpass';
      band.frequency.value = 1600;
      band.Q.value = 0.6;

      const hiss = audioContext.createBiquadFilter();
      hiss.type = 'highpass';
      hiss.frequency.value = 900;

      const g = audioContext.createGain();
      g.gain.value = 0.07;

      // ����������� tuning�: ��������� ��������� �������
      const lfo = audioContext.createOscillator();
      lfo.frequency.value = 0.17;
      const lfoGain = audioContext.createGain();
      lfoGain.gain.value = 700;
      lfo.connect(lfoGain);
      lfoGain.connect(band.frequency);

      src.connect(hiss); hiss.connect(band); band.connect(g); g.connect(audioContext.destination);
      src.start(); lfo.start();
      radioNodes = [src, lfo, lfoGain, band, hiss, g];
    } catch (err) {
      console.warn('�� ������� ��������� ��� �����:', err);
    }
  }

  function stopRadio() {
    radioNodes.forEach(node => { try { node.stop && node.stop(); node.disconnect(); } catch (e) {} });
    radioNodes = [];
  }

  // ===== HORN: ����������� ���� ��� ����� � Web Audio � �������� ������ � ������ =====
  let hornCtx = null, hornBuffer = null, hornSrcNode = null, hornGainNode = null;

  function hornTrimEnd(buf) {
    const ch = buf.getChannelData(0);
    let end = ch.length - 1;
    for (let i = ch.length - 1; i > 0; i--) {
      if (Math.abs(ch[i]) > 0.005) { end = i; break; }
    }
    return Math.min(buf.duration, end / buf.sampleRate + 0.01);
  }

  async function ensureHornBuffer() {
    if (hornBuffer || hornCtx === false) return hornBuffer;
    try {
      hornCtx = hornCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (hornCtx.state === 'suspended') await hornCtx.resume();
      const res = await fetch('horn.wav');
      if (!res.ok) throw new Error('http ' + res.status);
      const arr = await res.arrayBuffer();
      hornBuffer = await hornCtx.decodeAudioData(arr);
    } catch (e) {
      hornCtx = false; // ���� ���������� � fallback �� <audio>
    }
    return hornBuffer;
  }

  async function startHornContinuous() {
    const buf = await ensureHornBuffer();
    if (buf && hornCtx) {
      if (hornSrcNode) { try { hornSrcNode.stop(); hornSrcNode.disconnect(); } catch (e) {} hornSrcNode = null; }
      hornGainNode = hornGainNode || hornCtx.createGain();
      hornGainNode.gain.value = 1;
      const src = hornCtx.createBufferSource();
      src.buffer = buf;
      src.loop = true;
      try { src.loopEnd = hornTrimEnd(buf); } catch (e) {}
      src.connect(hornGainNode);
      hornGainNode.connect(hornCtx.destination);
      src.start(0);
      hornSrcNode = src;
      return;
    }
    playHold('horn'); // �������� �������
  }

  function stopHornContinuous() {
    if (hornSrcNode) {
      try { hornSrcNode.stop(); hornSrcNode.disconnect(); } catch (e) {}
      hornSrcNode = null;
      return;
    }
    stopHold('horn');
  }

  // ===== MAN ��-���������� =====
  // ����� � PA: MAN = ����� � �������� �������� ������ ���� ������.
  // ����� � HILO/YELP/WAIL: MAN = ������ ��� � �������� = �����, ����� = ����������� � ���� �� �����.

  let manAudio = null;      // ������ ������ ��� MAN
  let manOffset = 0;        // ����� ����� � ������ ������
  let manToneKey = null;    // ����� ��� ����� � ��������� ���
  let manFadeTimer = null;

  function fadeTo(s, target, ms, onDone) {
    if (manFadeTimer) clearInterval(manFadeTimer);
    const steps = 6;
    const startVol = s.volume;
    let i = 0;
    manFadeTimer = setInterval(() => {
      i++;
      s.volume = Math.min(1, Math.max(0, startVol + (target - startVol) * (i / steps)));
      if (i >= steps) {
        clearInterval(manFadeTimer);
        manFadeTimer = null;
        if (onDone) onDone();
      }
    }, ms / steps);
  }

  function startMan() {
    if (!powerOn) return;
    stopTrill(); stopSiren(); stopRadio();

    // ����� � PA > ������ MAN = �������� � �����
    if (modeIndex === 4) { startPA(); return; }

    // ������ ���; � PA/RADIO/STANDBY � WAIL
    const toneKey = [0, 1, 2].includes(modeIndex) ? ['hilo', 'yelp', 'wail'][modeIndex] : 'wail';
    const s = sounds[toneKey];
    if (!s) return;

    // ����� ���� � ���������� �����
    if (manToneKey !== toneKey) { manOffset = 0; manToneKey = toneKey; }

    if (manAudio && manAudio !== s) {
      try { manAudio.pause(); } catch (e) {}
    }
    s.loop = true;
    s.volume = 0;
    s.currentTime = (s.duration > 0) ? (manOffset % s.duration) : 0;
    manAudio = s;
    s.play().catch(err => console.warn('�� ������� ������� MAN:', err));
    fadeTo(s, 1, 120); // ������� ����������
  }

  function stopMan() {
    // �������� ����� ������, ���� �� ��� ������� ��� MAN
    stopPA();
    const s = manAudio;
    if (!s) return;
    manAudio = null;
    // ���������� ����� ����� � �����
    if (s.duration > 0 && isFinite(s.currentTime)) manOffset = s.currentTime;
    fadeTo(s, 0, 150, () => {
      s.pause();
      s.volume = 1;
    });
  }

  function updateMode() {
    modeLeds.forEach((id, i) => $(id)?.classList.toggle('active', i === modeIndex));
    const gear = document.querySelector('#mode .k-gear');
    if (gear) gear.style.transform = `rotate(${angles[modeIndex]}deg)`;
    stopTrill(); stopSiren(); stopPA(); stopRadio();
    if (!powerOn) return;
    // PA � ����� ���������: �� ���������� ������ ���������� MAN. STANDBY � ������.
    if (modeIndex === 0 || modeIndex === 1 || modeIndex === 2) startSiren();
    manOffset = 0; // ����� ������ � ����� ������� ���� ������������
  }

  $('mode').addEventListener('pointerdown', (event) => {
    event.preventDefault();
    modeIndex = (modeIndex + 1) % angles.length;
    vibrate();
    updateMode();
  });

  $('vol').addEventListener('pointerdown', (event) => {
    event.preventDefault();
    powerOn = !powerOn;
    $('led-off')?.classList.toggle('active', powerOn);
    const gear = document.querySelector('#vol .k-gear');
    if (gear) gear.style.transform = `rotate(${powerOn ? 65 : -15}deg)`;
    vibrate();
    if (powerOn) updateMode();
    else { stopTrill(); stopSiren(); stopPA(); stopRadio(); stopHold('short'); stopHold('horn'); stopMan(); }
  });

  // �������� ��������� ������ � ��� � ������ �����: pointer capture,
  // ��������� ������ �� ������, ������� ������� � ���������� ���������.
  const activePointers = { man: null, horn: null };

  function bindMultitouchHold(id, channel, onDown, onUp) {
    const btn = $(id);

    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (activePointers[channel] !== null) return;
      activePointers[channel] = e.pointerId;
      if (btn.setPointerCapture) {
        try { btn.setPointerCapture(e.pointerId); } catch (err) {}
      }
      onDown();
    });

    const releaseHandler = (e) => {
      if (activePointers[channel] !== e.pointerId) return;
      e.preventDefault();
      e.stopPropagation();
      activePointers[channel] = null;
      onUp();
    };

    btn.addEventListener('pointerup', releaseHandler);
    btn.addEventListener('pointercancel', releaseHandler);
  }

  bindMultitouchHold('btnMan', 'man', () => {
    if (!powerOn) { activePointers.man = null; return; }
    startMan();
    vibrate(50);
  }, () => {
    $('led-pa')?.classList.toggle('active', powerOn && modeIndex === 4);
    stopMan();
  });

  bindMultitouchHold('btnHorn', 'horn', () => {
    if (!powerOn) { activePointers.horn = null; return; }
    $('led-rad')?.classList.add('active');
    startHornContinuous();
    vibrate(100);
  }, () => {
    $('led-rad')?.classList.toggle('active', powerOn && modeIndex === 5);
    stopHornContinuous();
  });

  // ������ ������ ���� � �� �������, ��� � �����
  window.addEventListener('blur', () => {
    activePointers.man = null; activePointers.horn = null;
    stopMan(); stopHold('horn'); stopTrill(); stopSiren(); stopPA(); stopRadio();
  });

  // �������������� ��������� ����� � �����������.
  const volGear = document.querySelector('#vol .k-gear');
  if (volGear) volGear.style.transform = 'rotate(-15deg)';
  updateMode();
})();
