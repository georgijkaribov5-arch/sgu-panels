<title>Premier Hazard 7007</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #141416; font-family: 'Arial Narrow', Arial, sans-serif; }
  .unit { position: relative; display: flex; align-items: center; filter: drop-shadow(0 20px 30px #000); }
  .ear { width: 38px; height: 112px; position: relative; z-index: 1; background: linear-gradient(180deg, #2b2b2e 0%, #19191b 55%, #101012 100%); border: 1px solid #353538; box-shadow: inset 0 2px 2px rgba(255,255,255,.12); }
  .ear.l { border-radius: 12px 0 0 12px; margin-right: -4px; }
  .ear.r { border-radius: 0 12px 12px 0; margin-left: -4px; }
  .ear::after { content: ''; position: absolute; top: 50%; transform: translateY(-50%); width: 24px; height: 18px; background: #141416; box-shadow: inset 0 2px 4px #000; }
  .ear.l::after { left: -1px; border-radius: 0 9px 9px 0; border: 1px solid #333; border-left: none; }
  .ear.r::after { right: -1px; border-radius: 9px 0 0 9px; border: 1px solid #333; border-right: none; }
  .case { position: relative; z-index: 2; width: 356px; height: 274px; border-radius: 16px; padding: 13px; background: radial-gradient(circle at 25% 15%, rgba(255,255,255,.07), transparent 55%), linear-gradient(165deg, #27272a 0%, #161618 65%, #0d0d0f 100%); box-shadow: inset 0 2px 1.5px rgba(255,255,255,.18), inset 0 -4px 7px rgba(0,0,0,.95), 0 0 0 1.5px #09090a; }
  .face { position: relative; width: 100%; height: 100%; border-radius: 8px; background: linear-gradient(180deg, #1d1d20 0%, #141416 100%); box-shadow: inset 0 2px 6px rgba(0,0,0,.9); }
  .lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .t { position: absolute; color: #e8cf6b; font-weight: 800; letter-spacing: .3px; line-height: 1; text-shadow: 0 1px 1px #000; }
  .d { position: absolute; width: 8.5px; height: 8.5px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff5b8, #d8b84a 75%, #8c701e); box-shadow: 0 1px 2px #000; transition: all 0.1s; }
  .d.active { background: #ff0000 !important; box-shadow: 0 0 12px #ff0000, inset 0 0 5px #ff8080 !important; }
  .d-off { top: 96px; left: 26px; width: 7.5px; height: 7.5px; }
  .t-off { top: 109px; left: 16px; font-size: 13px; }
  .rj { position: absolute; bottom: 13px; left: 16px; width: 78px; height: 92px; background: #0a0a0c; border-radius: 6px; border: 2px solid #2a2a2e; box-shadow: inset 0 5px 10px #000; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px; }
  .rj-top { width: 56px; height: 52px; background: #040405; border: 1px solid #222; border-radius: 3px; position: relative; }
  .rj-pins { position: absolute; top: 3px; left: 50%; transform: translateX(-50%); width: 38px; height: 15px; background: repeating-linear-gradient(90deg, #cfa538 0 3px, transparent 3px 6.5px); }
  .rj-red { width: 38px; height: 17px; border-radius: 2px 2px 4px 4px; position: relative; background: linear-gradient(180deg, #e02e2e, #9c1717); box-shadow: 0 2px 3px #000; }
  .rj-red::before { content: ''; position: absolute; top: -4px; left: 8px; width: 22px; height: 5px; background: #be2020; border-radius: 2px 2px 0 0; }
  .t-hilo { top: 17px; right: 120px; font-size: 12.5px; } .d-hilo { top: 18px; right: 106px; }
  .t-yelp { top: 42px; right: 132px; font-size: 12.5px; } .d-yelp { top: 43px; right: 118px; }
  .t-wail { top: 67px; right: 133px; font-size: 12.5px; } .d-wail { top: 68px; right: 119px; }
  .t-stby { top: 92px; right: 124px; font-size: 12.5px; } .d-stby { top: 93px; right: 110px; }
.badge { position: absolute; top: 122px; left: 103px; width: 78px; height: 32px; border: 2px solid #e2c65e; border-radius: 5px; color: #e8cf6b; font-weight: 800; font-size: 10.5px; line-height: 1.
12; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .num { position: absolute; bottom: 20px; left: 112px; color: #e8cf6b; font-size: 20px; font-weight: 800; letter-spacing: 1px; }
  .d-pa  { top: 109px; left: 236px; width: 7.5px; height: 7.5px; }
  .d-rad { top: 112px; left: 264px; width: 7.5px; height: 7.5px; }
  .t-pa  { top: 121px; left: 230px; font-size: 12px; }
  .t-rad { top: 121px; left: 254px; font-size: 12px; }
  .t-man  { top: 141px; left: 204px; font-size: 12px; }
  .t-horn { top: 141px; left: 264px; font-size: 12px; }
  .b-slot { position: absolute; bottom: 14px; width: 52px; height: 52px; background: #0a0a0c; border-radius: 8px; padding: 3.5px; box-shadow: inset 0 2px 5px #000, 0 1px 1px rgba(255,255,255,.1); }
  .s-man  { left: 194px; }
  .s-horn { left: 262px; }
  .btn { width: 100%; height: 100%; border: none; border-radius: 6px; cursor: pointer; background: radial-gradient(circle at 35% 30%, #fafaf5, #dcdcd2 70%, #b5b5ab); box-shadow: 0 3px 6px #000, inset 0 2px 2px #fff, inset 0 -2px 3px rgba(0,0,0,.3); transition: transform .06s; }
  .btn:active { transform: translateY(3px) scale(.96); box-shadow: 0 0px 2px #000, inset 0 2px 5px rgba(0,0,0,0.5); }
  .knob { position: absolute; border-radius: 50%; cursor: pointer; box-shadow: 0 10px 18px rgba(0,0,0,.95), 0 3px 5px #000, 0 0 0 2px #09090a; }
  .k-vol  { top: 16px; left: 25px; width: 72px; height: 72px; }
  .k-mode { top: 10px; right: 16px; width: 96px; height: 96px; }
  .k-gear { width: 100%; height: 100%; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: repeating-conic-gradient(#303034 0deg 6deg, #121214 6deg 12deg); transition: transform .15s ease-out; }
  .k-top { width: 75%; height: 75%; border-radius: 50%; position: relative; background: radial-gradient(circle at 35% 30%, #36363a, #1e1e21 65%, #111113); box-shadow: inset 0 1.5px 2px rgba(255,255,255,.2), 0 2px 5px #000; }
  .k-top::before { content: ''; position: absolute; top: 6%; bottom: 6%; left: 50%; transform: translateX(-50%); width: 10px; border-radius: 3px; background: linear-gradient(90deg, #222225, #323236 50%, #18181a); box-shadow: -2px 0 3px rgba(0,0,0,.6), 2px 0 3px rgba(0,0,0,.6); }
  .k-top::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%); width: 4.5px; height: 8px; background: #f5f5f7; border-radius: 1px; z-index: 2; }
  .k-vol .k-top::after  { top: 3px; }
  .k-mode .k-top::after { bottom: 4px; }
</style>
</head>
<body>

<!-- Каждый звук — отдельный файл из этой же папки -->
<audio id="snd-short" src="short.mp3" preload="auto"></audio>
<audio id="snd-horn"  src="horn.wav"  preload="auto"></audio>
<audio id="snd-wail"  src="wail.wav"  preload="auto"></audio>
<audio id="snd-yelp"  src="yelp.mp3"  preload="auto"></audio>
<audio id="snd-hilo"  src="hilo.wav"  preload="auto"></audio>


<div class="unit">
  <div class="ear l"></div>
  <div class="case">
    <div class="face">
      <svg class="lines" viewBox="0 0 330 248" fill="none"><path d="M 8 6 H 322 V 242 H 254 V 168 H 186 V 242 H 8 Z" stroke="#e2c65e" stroke-width="2.6" stroke-linejoin="round"/></svg>
      <div class="knob k-vol" id="vol"><div class="k-gear" style="transform:rotate(-15deg)"><div class="k-top"></div></div></div>
      <div class="d d-off" id="led-off"></div>
      <div class="t t-off">OFF/VOL</div>
      <div class="rj"><div class="rj-top"><div class="rj-pins"></div></div><div class="rj-red"></div></div>
      <div class="t t-hilo">HILO</div><div class="d d-hilo" id="led-hilo"></div>
      <div class="t t-yelp">YELP</div><div class="d d-yelp" id="led-yelp"></div>
      <div class="t t-wail">WAIL</div><div class="d d-wail" id="led-wail"></div>
      <div class="t t-stby">STANDBY</div><div class="d d-stby" id="led-stby"></div>
      <div class="badge"><span>PREMIER</span><span>HAZARD</span></div>
<div class="num">7007</div>
      <div class="knob k-mode" id="mode"><div class="k-gear" style="transform:rotate(14deg)"><div class="k-top"></div></div></div>
      <div class="d d-pa" id="led-pa"></div><div class="d d-rad" id="led-rad"></div>
      <div class="t t-pa">PA</div><div class="t t-rad">RADIO</div>
      <div class="t t-man">MAN</div>
<div class="b-slot s-man"><button class="btn" id="btnMan"></button></div>
      <div class="t t-horn">HORN</div>
      <div class="b-slot s-horn"><button class="btn" id="btnHorn"></button></div>
    </div>
  </div>
  <div class="ear r"></div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const angles = [115, 90, 65, 40, 14, -14];
  const modeLeds = ['led-hilo', 'led-yelp', 'led-wail', 'led-stby', 'led-pa', 'led-rad'];
  let modeIndex = 4; // PA при запуске
  let powerOn = false;
  const sounds = {
    short: $('snd-short'),
    horn: $('snd-horn'),
    wail: $('snd-wail'),
    yelp: $('snd-yelp'),
    hilo: $('snd-hilo')
  };
  // Сирены (wail/yelp/hilo) звучат циклично, пока включён режим
  let sirenAudio = null;

  function stopSiren() {
    if (sirenAudio) {
      sirenAudio.pause();
      sirenAudio.currentTime = 0;
      sirenAudio = null;
    }
  }

  function startSiren() {
    stopSiren();
    const s = sounds[['hilo', 'yelp', 'wail'][modeIndex]];
    if (!s) return;
    s.loop = true;
    s.volume = 1;
    s.currentTime = 0;
    sirenAudio = s;
    s.play().catch(err => console.warn('Не удалось сыграть сирену:', err));
  }

  function playHold(name) {
    const s = sounds[name];
    if (!s) return;
    s.loop = true;
    s.volume = 1;
    s.currentTime = 0;
    s.play().catch(err => console.warn('Не удалось сыграть ' + name + ':', err));
  }

  function stopHold(name) {
    const s = sounds[name];
    if (!s) return;
    s.pause();
    s.currentTime = 0;
  }
  let audioContext = null;
  let trillTimer = null;
  let trillOsc = null;
  let trillGain = null;

  function vibrate(ms = 20) {
    if (navigator.vibrate) navigator.vibrate(ms);
  }

  function stopTrill() {
    if (trillTimer) {
      clearInterval(trillTimer);
      trillTimer = null;
    }
    if (trillGain && audioContext) {
      try { trillGain.gain.setTargetAtTime(0, audioContext.currentTime, 0.015); } catch (e) {}
    }
    if (trillOsc) {
      try { trillOsc.stop(); } catch (e) {}
      trillOsc = null;
    }
    trillGain = null;
  }

  async function startTrill() {
    stopTrill();
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      audioContext = audioContext || new AudioCtx();
      if (audioContext.state === 'suspended') await audioContext.resume();

      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const filter = audioContext.createBiquadFilter();
      osc.type = 'square';
      osc.frequency.value = 760;
      filter.type = 'lowpass';
      filter.frequency.value = 1800;
      gain.gain.value = 0;
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioContext.destination);
      osc.start();
      trillOsc = osc;
      trillGain = gain;

      let phase = false;
      const pulse = () => {
        if (!trillGain || !audioContext) return;
        phase = !phase;
        const now = audioContext.currentTime;
        trillGain.gain.cancelScheduledValues(now);
        trillGain.gain.setTargetAtTime(phase ? 0.13 : 0.008, now, 0.008);
        if (trillOsc) trillOsc.frequency.setTargetAtTime(phase ? 920 : 680, now, 0.012);
      };
      pulse();
      trillTimer = setInterval(pulse, 115);
    } catch (err) {
      console.warn('Не удалось запустить звук PA:', err);
    }
  }

  // ===== PA: живой микрофон с эффектом рупора =====
  let micStream = null;
  let micNodes = [];

  function makeHornDistortion(amount) {
    const n = 44100;
    const curve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i * 2) / n - 1;
      curve[i] = ((3 + amount) * x * 20 * (Math.PI / 180)) / (Math.PI + amount * Math.abs(x));
    }
    return curve;
  }

  async function startPA() {
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no mic');
      audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') await audioContext.resume();

      micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false } });
      const source = audioContext.createMediaStreamSource(micStream);

      const hp = audioContext.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 460; hp.Q.value = 0.8;
      const peak = audioContext.createBiquadFilter();
      peak.type = 'peaking'; peak.frequency.value = 1350; peak.Q.value = 1.6; peak.gain.value = 11;
      const lp = audioContext.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 2900; lp.Q.value = 0.9;
      const shaper = audioContext.createWaveShaper();
      shaper.curve = makeHornDistortion(18);
      shaper.oversample = '2x';
      const g = audioContext.createGain();
      g.gain.value = 2.2;
      const delay = audioContext.createDelay();
      delay.delayTime.value = 0.13;
      const echo = audioContext.createGain();
      echo.gain.value = 0.24;

      source.connect(hp); hp.connect(peak); peak.connect(lp); lp.connect(shaper); shaper.connect(g);
      g.connect(audioContext.destination);
      g.connect(delay); delay.connect(echo); echo.connect(audioContext.destination);
      micNodes = [source, hp, peak, lp, shaper, g, delay, echo];
    } catch (err) {
      // Микрофона нет — оставляем синтезированную трель как запасной вариант
      startTrill();
    }
  }

  function stopPA() {
    micNodes.forEach(node => { try { node.disconnect(); } catch (e) {} });
    micNodes = [];
    if (micStream) {
      micStream.getTracks().forEach(t => t.stop());
      micStream = null;
    }
  }

  // ===== RADIO: шум эфира =====
  let radioNodes = [];

  function startRadio() {
    stopRadio();
    try {
      audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();

      // Белый шум
      const len = audioContext.sampleRate * 2;
      const buf = audioContext.createBuffer(1, len, audioContext.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = audioContext.createBufferSource();
      src.buffer = buf;
      src.loop = true;

      const band = audioContext.createBiquadFilter();
      band.type = 'bandpass';
      band.frequency.value = 1600;
      band.Q.value = 0.6;

      const hiss = audioContext.createBiquadFilter();
      hiss.type = 'highpass';
      hiss.frequency.value = 900;

      const g = audioContext.createGain();
      g.gain.value = 0.07;

      // «Переменная tuning»: медленное блуждание частоты
      const lfo = audioContext.createOscillator();
      lfo.frequency.value = 0.17;
      const lfoGain = audioContext.createGain();
      lfoGain.gain.value = 700;
      lfo.connect(lfoGain);
      lfoGain.connect(band.frequency);

      src.connect(hiss); hiss.connect(band); band.connect(g); g.connect(audioContext.destination);
      src.start(); lfo.start();
      radioNodes = [src, lfo, lfoGain, band, hiss, g];
    } catch (err) {
      console.warn('Не удалось запустить шум радио:', err);
    }
  }

  function stopRadio() {
    radioNodes.forEach(node => { try { node.stop && node.stop(); node.disconnect(); } catch (e) {} });
    radioNodes = [];
  }

  // ===== HORN: непрерывный звук без паузы — Web Audio с обрезкой тишины в хвосте =====
  let hornCtx = null, hornBuffer = null, hornSrcNode = null, hornGainNode = null;

  function hornTrimEnd(buf) {
    const ch = buf.getChannelData(0);
    let end = ch.length - 1;
    for (let i = ch.length - 1; i > 0; i--) {
      if (Math.abs(ch[i]) > 0.005) { end = i; break; }
    }
    return Math.min(buf.duration, end / buf.sampleRate + 0.01);
  }

  async function ensureHornBuffer() {
    if (hornBuffer || hornCtx === false) return hornBuffer;
    try {
      hornCtx = hornCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (hornCtx.state === 'suspended') await hornCtx.resume();
      const res = await fetch('horn.wav');
      if (!res.ok) throw new Error('http ' + res.status);
      const arr = await res.arrayBuffer();
      hornBuffer = await hornCtx.decodeAudioData(arr);
    } catch (e) {
      hornCtx = false; // файл недоступен — fallback на <audio>
    }
    return hornBuffer;
  }

  async function startHornContinuous() {
    const buf = await ensureHornBuffer();
    if (buf && hornCtx) {
      if (hornSrcNode) { try { hornSrcNode.stop(); hornSrcNode.disconnect(); } catch (e) {} hornSrcNode = null; }
      hornGainNode = hornGainNode || hornCtx.createGain();
      hornGainNode.gain.value = 1;
      const src = hornCtx.createBufferSource();
      src.buffer = buf;
      src.loop = true;
      try { src.loopEnd = hornTrimEnd(buf); } catch (e) {}
      src.connect(hornGainNode);
      hornGainNode.connect(hornCtx.destination);
      src.start(0);
      hornSrcNode = src;
      return;
    }
    playHold('horn'); // запасной вариант
  }

  function stopHornContinuous() {
    if (hornSrcNode) {
      try { hornSrcNode.stop(); hornSrcNode.disconnect(); } catch (e) {}
      hornSrcNode = null;
      return;
    }
    stopHold('horn');
  }

  // ===== MAN по-настоящему =====
  // Ручка в PA: MAN = рация — микрофон работает только пока держим.
  // Ручка в HILO/YELP/WAIL: MAN = ручной тон — отпустил = пауза, нажал = продолжение с того же места.

  let manAudio = null;      // сейчас играет под MAN
  let manOffset = 0;        // место паузы в сэмпле сирены
  let manToneKey = null;    // какой тон играл в последний раз
  let manFadeTimer = null;

  function fadeTo(s, target, ms, onDone) {
    if (manFadeTimer) clearInterval(manFadeTimer);
    const steps = 6;
    const startVol = s.volume;
    let i = 0;
    manFadeTimer = setInterval(() => {
      i++;
      s.volume = Math.min(1, Math.max(0, startVol + (target - startVol) * (i / steps)));
      if (i >= steps) {
        clearInterval(manFadeTimer);
        manFadeTimer = null;
        if (onDone) onDone();
      }
    }, ms / steps);
  }

  function startMan() {
    if (!powerOn) return;
    stopTrill(); stopSiren(); stopRadio();

    // Ручка в PA → держим MAN = микрофон в эфире
    if (modeIndex === 4) { startPA(); return; }

    // Ручной тон; в PA/RADIO/STANDBY — WAIL
    const toneKey = [0, 1, 2].includes(modeIndex) ? ['hilo', 'yelp', 'wail'][modeIndex] : 'wail';
    const s = sounds[toneKey];
    if (!s) return;

    // Смена тона — сбрасываем паузу
    if (manToneKey !== toneKey) { manOffset = 0; manToneKey = toneKey; }

    if (manAudio && manAudio !== s) {
      try { manAudio.pause(); } catch (e) {}
    }
    s.loop = true;
    s.volume = 0;
    s.currentTime = (s.duration > 0) ? (manOffset % s.duration) : 0;
    manAudio = s;
    s.play().catch(err => console.warn('Не удалось сыграть MAN:', err));
    fadeTo(s, 1, 120); // быстрое нарастание
  }

  function stopMan() {
    // Микрофон гасим всегда, если он был запущен под MAN
    stopPA();
    const s = manAudio;
    if (!s) return;
    manAudio = null;
    // Запоминаем место паузы и гасим
    if (s.duration > 0 && isFinite(s.currentTime)) manOffset = s.currentTime;
    fadeTo(s, 0, 150, () => {
      s.pause();
      s.volume = 1;
    });
  }

  function updateMode() {
    modeLeds.forEach((id, i) => $(id)?.classList.toggle('active', i === modeIndex));
    const gear = document.querySelector('#mode .k-gear');
    if (gear) gear.style.transform = `rotate(${angles[modeIndex]}deg)`;
    stopTrill(); stopSiren(); stopPA(); stopRadio();
    if (!powerOn) return;
    // PA — режим микрофона: он включается только удержанием MAN. STANDBY — тишина.
    if (modeIndex === 0 || modeIndex === 1 || modeIndex === 2) startSiren();
    manOffset = 0; // смена режима — пауза ручного тона сбрасывается
  }

  $('mode').addEventListener('pointerdown', (event) => {
    event.preventDefault();
    modeIndex = (modeIndex + 1) % angles.length;
    vibrate();
    updateMode();
  });

  $('vol').addEventListener('pointerdown', (event) => {
    event.preventDefault();
    powerOn = !powerOn;
    $('led-off')?.classList.toggle('active', powerOn);
    const gear = document.querySelector('#vol .k-gear');
    if (gear) gear.style.transform = `rotate(${powerOn ? 65 : -15}deg)`;
    vibrate();
    if (powerOn) updateMode();
    else { stopTrill(); stopSiren(); stopPA(); stopRadio(); stopHold('short'); stopHold('horn'); stopMan(); }
  });

  // Механика удержания кнопок — как в пульте ГИБДД: pointer capture,
  // отдельный «канал» на кнопку, двойное нажатие и «залипание» исключены.
  const activePointers = { man: null, horn: null };

  function bindMultitouchHold(id, channel, onDown, onUp) {
    const btn = $(id);

    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (activePointers[channel] !== null) return;
      activePointers[channel] = e.pointerId;
      if (btn.setPointerCapture) {
        try { btn.setPointerCapture(e.pointerId); } catch (err) {}
      }
      onDown();
    });

    const releaseHandler = (e) => {
      if (activePointers[channel] !== e.pointerId) return;
      e.preventDefault();
      e.stopPropagation();
      activePointers[channel] = null;
      onUp();
    };

    btn.addEventListener('pointerup', releaseHandler);
    btn.addEventListener('pointercancel', releaseHandler);
  }

  bindMultitouchHold('btnMan', 'man', () => {
    if (!powerOn) { activePointers.man = null; return; }
    startMan();
    vibrate(50);
  }, () => {
    $('led-pa')?.classList.toggle('active', powerOn && modeIndex === 4);
    stopMan();
  });

  bindMultitouchHold('btnHorn', 'horn', () => {
    if (!powerOn) { activePointers.horn = null; return; }
    $('led-rad')?.classList.add('active');
    startHornContinuous();
    vibrate(100);
  }, () => {
    $('led-rad')?.classList.toggle('active', powerOn && modeIndex === 5);
    stopHornContinuous();
  });

  // Потеря фокуса окна — всё глохнет, как в ГИБДД
  window.addEventListener('blur', () => {
    activePointers.man = null; activePointers.horn = null;
    stopMan(); stopHold('horn'); stopTrill(); stopSiren(); stopPA(); stopRadio();
  });

  // Первоначальное положение ручек и индикаторов.
  const volGear = document.querySelector('#vol .k-gear');
  if (volGear) volGear.style.transform = 'rotate(-15deg)';
  updateMode();
})();
</script>
