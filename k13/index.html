<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Пульт СГУ K-13</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 45%, #242731 0%, #0f1015 100%);
    font-family: Arial, Helvetica, sans-serif;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: manipulation;
  }

  /* Внешний контейнер пульта с боковыми ушками */
  .k13-container {
    position: relative;
    width: 92vw;
    max-width: 480px;
    margin: 0 auto;
  }

  /* Боковые монтажные проушины как на оригинале */
  .side-ear {
    position: absolute;
    width: 10px;
    height: 30px;
    background: #111216;
    border: 1px solid #353841;
    z-index: 1;
  }
  .ear-1 { left: -8px; top: 15%; border-radius: 4px 0 0 4px; }
  .ear-2 { left: -8px; bottom: 15%; border-radius: 4px 0 0 4px; }
  .ear-3 { right: -8px; top: 15%; border-radius: 0 4px 4px 0; }
  .ear-4 { right: -8px; bottom: 15%; border-radius: 0 4px 4px 0; }

  /* Нижний разъём/переключатель на торце */
  .bottom-connector {
    position: absolute;
    bottom: -6px;
    right: 22%;
    width: 42px;
    height: 7px;
    background: linear-gradient(90deg, #090a0c, #4b4f59 50%, #090a0c);
    border: 1px solid #606570;
    border-radius: 0 0 3px 3px;
    z-index: 1;
  }

  /* Корпус пульта K-13 с зернистой шагренью */
  .k13-body {
    position: relative;
    width: 100%;
    padding: 14px 12px;
    border-radius: 8px;
    background-color: #2b2d32;
    background-image:
      radial-gradient(rgba(255, 255, 255, 0.16) 0.9px, transparent 0.9px),
      radial-gradient(rgba(0, 0, 0, 0.55) 1px, transparent 1px),
      linear-gradient(180deg, #3a3d45 0%, #26282e 55%, #191a1e 100%);
    background-size: 5px 5px, 4px 4px, 100% 100%;
    background-position: 0 0, 2px 2px, 0 0;
    border-top: 2px solid #5d616b;
    border-left: 2px solid #43464f;
    border-right: 2px solid #1d1f24;
    border-bottom: 6px solid #0d0e11;
    box-shadow: 0 22px 45px rgba(0, 0, 0, 0.92);
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: stretch;
    z-index: 2;
  }

  /* Тонкая золотая разделительная линия через весь корпус */
  .gold-stripe {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 1.5px;
    margin-top: -1px;
    background: linear-gradient(90deg, #c7b05e 0%, #f3df8d 50%, #bda44f 100%);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
    pointer-events: none;
    z-index: 3;
  }

  /* Левая секция с 6 кнопками (66% ширины корпуса) */
  .keys-section {
    width: 66%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 4;
  }

  .keys-row {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    width: 100%;
  }

  /* Физическая кнопка K-13 с широкой рамкой и выпуклой серединой */
  .k13-btn {
    width: 31%;
    height: 62px;
    border: none;
    border-radius: 4px;
    padding: 0;
    margin: 0;
    cursor: pointer;
    outline: none;
    background: linear-gradient(165deg, #282a30 0%, #141518 65%, #0b0c0e 100%);
    box-shadow:
      0 5px 0 #060708,
      0 7px 10px rgba(0, 0, 0, 0.85),
      inset 0 1px 1px rgba(255, 255, 255, 0.22);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.04s ease, box-shadow 0.04s ease;
  }

  .k13-btn-inner {
    width: 64%;
    height: 62%;
    border-radius: 2.5px;
    border-top: 1px solid rgba(255, 255, 255, 0.25);
    border-left: 1px solid rgba(255, 255, 255, 0.12);
    border-right: 1px solid rgba(0, 0, 0, 0.8);
    border-bottom: 2px solid rgba(0, 0, 0, 0.9);
    box-shadow: 0 3px 5px rgba(0, 0, 0, 0.85);
    pointer-events: none;
  }

  /* Состояние физического нажатия */
  .k13-btn:active,
  .k13-btn.pressed {
    transform: translateY(4px);
    box-shadow:
      0 1px 0 #060708,
      0 2px 4px rgba(0, 0, 0, 0.9),
      inset 0 2px 6px #000000;
  }

  .k13-btn:active .k13-btn-inner,
  .k13-btn.pressed .k13-btn-inner {
    transform: scale(0.96);
    background: linear-gradient(170deg, #26282e 0%, #151619 100%);
  }

  /* Фиксация активного режима (SIREN / PULSAR) */
  .k13-btn.latched {
    transform: translateY(3px);
    box-shadow:
      0 2px 0 #060708,
      0 0 11px rgba(250, 204, 21, 0.55),
      inset 0 1px 4px rgba(250, 204, 21, 0.35);
  }

  .k13-btn.latched .k13-btn-inner {
    border-top-color: #fde047;
  }

  /* Блок надписей над и под золотой линией */
  .labels-block {
    margin: 6px 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .labels-line {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    width: 100%;
  }

  .lbl-item {
    width: 31%;
    text-align: center;
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    font-size: 9.5px;
    letter-spacing: 0.2px;
    color: #f3f4f6;
    text-shadow: 0 1px 2px #000000;
    white-space: nowrap;
  }

  /* Правая секция: надпись K-13 и золотой герб (31% ширины корпуса) */
  .brand-section {
    width: 31%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    z-index: 4;
    padding: 2px 0;
  }

  .k13-heading {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 900;
    font-size: 32px;
    letter-spacing: -1px;
    color: #f8fafc;
    line-height: 1;
    margin-top: 4px;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95);
    white-space: nowrap;
  }

  /* Золотой круглый герб с башней */
  .crest-circle {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fef08a 0%, #d4af37 45%, #8a6d1b 85%, #42330a 100%);
    border: 2px solid #fef08a;
    box-shadow:
      0 4px 10px rgba(0, 0, 0, 0.85),
      inset 0 0 0 2.5px #5c460c,
      inset 0 0 0 4.5px #facc15;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .crest-ring {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 2.5px dotted #fef9c3;
    background: radial-gradient(circle, #9e7b1c 0%, #5c4509 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .crest-center {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1.5px solid #fef08a;
    background: #7c5e10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    overflow: hidden;
  }

  .t-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #fef9c3;
    margin-bottom: 1px;
  }

  .t-roof {
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-bottom: 5px solid #fef9c3;
  }

  .t-wall {
    width: 11px;
    height: 18px;
    background: linear-gradient(180deg, #fef9c3 0%, #eab308 100%);
    border-left: 1px solid #42330a;
    border-right: 1px solid #42330a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-evenly;
  }

  .t-win {
    width: 3px;
    height: 3.5px;
    background: #5c4509;
  }

  .info-bar {
    margin-top: 14px;
    font-size: 12px;
    color: #9ca3af;
    text-align: center;
  }
  .info-bar b {
    color: #facc15;
  }
</style>
</head>
<body>
    <div class="side-ear ear-1"></div>
    <div class="side-ear ear-2"></div>
    <div class="side-ear ear-3"></div>
    <div class="side-ear ear-4"></div>
    <div class="bottom-connector"></div>

    <div class="k13-body">
      <div class="gold-stripe"></div>

      <!-- Левая часть с 6 кнопками и надписями -->
      <div class="keys-section">
        <div class="keys-row">
          <button class="k13-btn" id="btn-short" type="button"><div class="k13-btn-inner"></div></button>
          <button class="k13-btn" id="btn-horn" type="button"><div class="k13-btn-inner"></div></button>
          <button class="k13-btn" id="btn-pulsar" type="button"><div class="k13-btn-inner"></div></button>
        </div>

        <div class="labels-block">
          <div class="labels-line">
            <div class="lbl-item">SHORT</div>
            <div class="lbl-item">HORN</div>
            <div class="lbl-item">PULSAR</div>

          <div class="labels-line">
            <div class="lbl-item">SIREN</div>
            <div class="lbl-item">MANUAL</div>
            <div class="lbl-item">MODE</div>
          </div>
        </div>

        <div class="keys-row">
          <button class="k13-btn" id="btn-siren" type="button"><div class="k13-btn-inner"></div></button>
          <button class="k13-btn" id="btn-manual" type="button"><div class="k13-btn-inner"></div></button>
          <button class="k13-btn" id="btn-mode" type="button"><div class="k13-btn-inner"></div></button>
        </div>
      </div>

      <!-- Правая часть: надпись K-13 и герб -->
      <div class="brand-section">
        <div class="k13-heading">K-13</div>

        <div class="crest-circle">
          <div class="crest-ring">
            <div class="crest-center">
              <div class="t-dot"></div>

              <div class="t-wall">
                <div class="t-win"></div>

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="info-bar">
    Режим: <b id="tone-text">WAIL</b> | Статус: <b id="status-text">Готов</b>
  </div>
